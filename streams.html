<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasalat Demo</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/7.21.5/video-js.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap">

  <style>
    /* ── Tokens ───────────────────────────── */
    :root {
      --bg:         #F5F5F7;
      --surface:    #FFFFFF;
      --surface-2:  #F2F2F3;
      --border:     #E0E0E2;
      --fg:         #191919;
      --fg-muted:   #6E6E73;
      --accent:     #6F10A2;
      --accent-dim: #EDE0F7;
      --live:       #16a34a;
      --danger:     #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', 'Noto Kufi Arabic', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .layout {
      max-width: 1060px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    /* ── Header ───────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 22px;
      background: var(--surface);
      border-radius: 14px;
      padding: 12px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px var(--border);
    }
    .logo {
      width: auto; height: 40px;
      background: transparent;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { color: #fff; }
    .app-name    { font-size: 1.2rem; font-weight: 600; letter-spacing: -.02em; }
    .app-tagline { font-size: .775rem; color: var(--fg-muted); margin-top: 1px; }
    .header-actions {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .nav-link {
      font-size: .8rem; color: var(--fg-muted);
      text-decoration: none;
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: all .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-link:hover { color: var(--fg); border-color: var(--accent); }
    .social-link {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--fg-muted);
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all .15s; flex-shrink: 0;
    }
    .social-link:hover { color: var(--fg); border-color: var(--accent); }
    .social-link.fb { color: #1877f2; border-color: rgba(24,119,242,.3); background: rgba(24,119,242,.06); }
    .social-link.fb:hover { border-color: #1877f2; background: rgba(24,119,242,.12); }
    .social-link.yt { color: #ff0000; border-color: rgba(255,0,0,.3); background: rgba(255,0,0,.06); }
    .social-link.yt:hover { border-color: #ff0000; background: rgba(255,0,0,.12); }

    /* ── Tab Bar ──────────────────────────── */
    .tab-bar {
      display: flex; gap: 0;
      margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px; border-radius: 10px; border: none;
      background: transparent; color: var(--fg-muted);
      font-family: inherit; font-size: .88rem; font-weight: 500;
      cursor: pointer; transition: all .18s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .route-badge {
      font-size: .7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 4px;
      background: var(--surface-2);
      color: var(--fg-muted);
      letter-spacing: .04em;
      transition: all .15s;
    }
    .tab-btn.active               { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(111,16,162,.25); }
    .tab-btn.active .route-badge  { background: rgba(255,255,255,.22); color: #fff; }
    .tab-btn:hover:not(.active)   { background: var(--accent-dim); color: var(--accent); }

    /* ── Tab panels ───────────────────────── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Sub-tabs (inside Own Player) ─────── */
    .sub-tab-bar {
      display: flex; gap: 0;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .sub-tab-btn {
      flex: 1;
      padding: 9px 16px; border-radius: 8px; border: none;
      background: transparent; color: var(--fg-muted);
      font-family: inherit; font-size: .85rem; font-weight: 500;
      cursor: pointer; transition: all .18s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .sub-tab-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(111,16,162,.25); }
    .sub-tab-btn:hover:not(.active) { background: var(--accent-dim); color: var(--accent); }

    /* ── Config card ──────────────────────── */
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .label-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }
    .input-label {
      font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--fg-muted);
    }
    .vr180-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      background: var(--accent-dim); border: 1px solid var(--accent);
      color: var(--accent); font-size: .7rem; font-weight: 500;
    }
    .pending-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--fg-muted); font-size: .7rem; font-weight: 500;
    }
    .pending-badge .pdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--fg-muted);
      animation: pblink 2s ease-in-out infinite;
    }
    @keyframes pblink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .config-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* Mode toggle (Live / Playback) */
    .mode-toggle {
      display: flex; gap: 3px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 3px;
      flex-shrink: 0;
    }
    .mode-btn {
      padding: 7px 16px; border-radius: 8px; border: none;
      background: transparent; color: var(--fg-muted);
      font-family: inherit; font-size: .82rem; font-weight: 500;
      cursor: pointer; transition: all .18s;
    }
    .mode-btn.active { background: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(111,16,162,.3); }
    .mode-btn:hover:not(.active) { background: var(--accent-dim); color: var(--accent); }

    .embed-url {
      flex: 1; min-width: 0;
      padding: 9px 13px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--fg);
      font-family: inherit; font-size: .875rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .embed-url:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(111,16,162,.12); }
    .embed-url::placeholder { color: var(--fg-muted); }

    /* Buttons */
    .btn {
      padding: 9px 18px; border-radius: 10px; border: none;
      font-family: inherit; font-size: .84rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all .18s; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(111,16,162,.22); }
    .btn-primary:hover  { filter: brightness(1.1); box-shadow: 0 4px 14px rgba(111,16,162,.32); }
    .btn-primary:active { filter: brightness(.95); }
    .btn-stop {
      background: rgba(220,38,38,.08); color: var(--danger);
      border: 1px solid rgba(220,38,38,.2);
    }
    .btn-stop:hover { background: rgba(220,38,38,.14); }

    /* URL hint row */
    .hint-row {
      margin-top: 10px;
      font-size: .73rem; color: var(--fg-muted);
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    }
    .hint-row code {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 7px;
      font-family: 'Courier New', monospace; font-size: .71rem;
      color: var(--accent);
    }

    /* Sample chips */
    .sample-row { margin-top: 11px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .sample-hint { font-size: .72rem; color: var(--fg-muted); flex-shrink: 0; }
    .chip {
      font-size: .75rem; padding: 4px 13px;
      border-radius: 20px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--fg-muted);
      cursor: pointer; font-family: inherit; transition: all .18s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .active-chip { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 600; }

    /* Error / info box */
    .error-box {
      display: none; margin-top: 11px; padding: 9px 13px;
      background: rgba(220,38,38,.06); border: 1px solid rgba(220,38,38,.18);
      border-radius: 8px; font-size: .83rem; color: var(--danger); line-height: 1.4;
    }
    .error-box .retry-btn {
      margin-left: 10px; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(220,38,38,.4);
      background: rgba(220,38,38,.1); color: var(--danger); font-size: .8rem;
      cursor: pointer; font-family: inherit; vertical-align: middle;
    }
    .error-box .retry-btn:hover { background: rgba(220,38,38,.2); }

    /* ── Embed shell (Route A / B) ─────────── */
    .embed-shell {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }
    .embed-frame-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    }
    .embed-frame-wrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: block;
    }
    .embed-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: var(--fg-muted);
      text-align: center; padding: 20px;
    }
    .embed-placeholder svg { opacity: .28; }
    .embed-placeholder p    { font-size: .875rem; }
    .embed-placeholder small { font-size: .75rem; opacity: .65; }

    /* ── Status Bar ───────────────────────── */
    .status-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border);
      transition: background .3s; flex-shrink: 0;
    }
    .status-dot.s-live    { background: var(--live); box-shadow: 0 0 0 3px rgba(22,163,74,.2); animation: pdot 2s ease-in-out infinite; }
    .status-dot.s-loading { background: var(--accent); }
    .status-dot.s-error   { background: var(--danger); }
    @keyframes pdot {
      0%,100% { box-shadow: 0 0 0 3px rgba(22,163,74,.2); }
      50%      { box-shadow: 0 0 0 6px rgba(22,163,74,.06); }
    }
    .status-label { font-size: .775rem; color: var(--fg-muted); font-weight: 500; }
    .status-meta  { margin-left: auto; display: flex; gap: 14px; font-size: .75rem; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

    /* ── Player shell (Route C) ───────────── */
    .player-shell {
      background: #000; border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }
    .player-wrap { position: relative; width: 100%; background: #000; }

    .video-js {
      width: 100% !important; height: auto !important;
      aspect-ratio: 16 / 9; display: block;
    }
    #threeCanvas, #threeCanvasBH {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: none; z-index: 2; touch-action: none; cursor: grab;
    }
    #threeCanvas.dragging, #threeCanvasBH.dragging { cursor: grabbing; }

    .video-js .vjs-control-bar     { z-index: 5 !important; background: linear-gradient(transparent, rgba(0,0,0,.88)); height: 46px; }
    .video-js .vjs-big-play-button { z-index: 5 !important; }
    .video-js .vjs-big-play-button {
      background: rgba(111,16,162,.85); border: none;
      border-radius: 50%;
      width: 68px; height: 68px; line-height: 68px;
      margin-top: -34px; margin-left: -34px;
      top: 50%; left: 50%;
      font-size: 2rem;
      transition: background .2s, transform .15s;
    }
    .video-js:hover .vjs-big-play-button,
    .video-js .vjs-big-play-button:focus { background: var(--accent); transform: scale(1.07); border: none; }
    .video-js .vjs-play-progress,
    .video-js .vjs-volume-level { background: var(--accent); }
    .video-js .vjs-play-progress:before { color: var(--accent); }
    .video-js .vjs-loading-spinner:before,
    .video-js .vjs-loading-spinner:after { border-top-color: var(--accent); }

    /* View-mode overlay buttons */
    .view-btns {
      position: absolute; top: 12px; right: 12px;
      z-index: 6; display: flex; gap: 4px;
    }
    .view-btn {
      padding: 5px 11px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.55); color: rgba(255,255,255,.75);
      font-size: .73rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: all .15s;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .view-btn.active              { background: var(--accent); border-color: var(--accent); color: #fff; }
    .view-btn:hover:not(.active)  { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }

    .drag-hint {
      position: absolute; bottom: 58px; left: 50%;
      transform: translateX(-50%); z-index: 6;
      background: rgba(0,0,0,.55); color: rgba(255,255,255,.7);
      font-size: .73rem; padding: 5px 14px; border-radius: 20px;
      pointer-events: none; opacity: 0; transition: opacity .4s;
      white-space: nowrap;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .drag-hint.show { opacity: 1; }

    /* stream url input (Route C) */
    .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .stream-url {
      flex: 1; min-width: 0; padding: 9px 13px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--fg);
      font-family: inherit; font-size: .875rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .stream-url:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .stream-url::placeholder { color: var(--fg-muted); }

    /* Keyboard shortcuts */
    .shortcuts { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 5px 18px; }
    .shortcut   { display: flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--fg-muted); }
    kbd {
      display: inline-block; padding: 2px 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; font-size: .68rem; font-family: inherit; color: var(--fg-muted);
    }

    /* ── Inner tabs (inside Route B) ────── */
    .inner-tab-bar {
      display: flex; gap: 3px;
      margin-bottom: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }
    .inner-tab-btn {
      flex: 1;
      padding: 7px 14px; border-radius: 7px; border: none;
      background: transparent; color: var(--fg-muted);
      font-family: inherit; font-size: .8rem; font-weight: 500;
      cursor: pointer; transition: all .15s;
    }
    .inner-tab-btn.active { background: var(--accent); color: #fff; }
    .inner-tab-btn:hover:not(.active) { background: var(--accent-dim); color: var(--accent); }
    .inner-panel { display: none; }
    .inner-panel.active { display: block; }

    @media (max-width: 600px) {
      .tab-label  { display: none; }
      .config-row { flex-direction: column; }
      .btn        { justify-content: center; }
      .status-meta { display: none; }
      .hint-row   { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <img id="wasaltLogo" alt="Wasalt Logo" loading="lazy" width="180" height="62" decoding="async" data-nimg="1" style="color:transparent;height:40px;width:auto" src="https://cdn.wasalt.sa/images/wasalt-logo.svg">
    </div>
    <div class="header-actions">
      <a href="https://www.facebook.com/profile.php?id=100008426927364" target="_blank" rel="noopener noreferrer"
         class="social-link fb" aria-label="Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </a>
      <a href="https://www.youtube.com/@waslat-test" target="_blank" rel="noopener noreferrer"
         class="social-link yt" aria-label="YouTube">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Tab bar -->
  <div class="tab-bar" role="tablist" aria-label="Streaming routes">
    <button class="tab-btn active" data-tab="routeA" role="tab" aria-selected="true" aria-controls="routeA">
      OneStream
    </button>
    <button class="tab-btn" data-tab="routeB" role="tab" aria-selected="false" aria-controls="routeB">
      Restream
    </button>
    <button class="tab-btn" data-tab="routeC" role="tab" aria-selected="false" aria-controls="routeC">
      Own Player
    </button>
  </div>

  <!-- ══════════════════════════════════════
       ROUTE A — OneStream
  ══════════════════════════════════════ -->
  <div class="tab-panel active" id="routeA" role="tabpanel">

    <div class="config-card">
      <div class="label-row">
        <label class="input-label">OneStream Embed</label>
      </div>
      <div class="mode-toggle" id="modeToggleA">
        <button class="mode-btn active" data-mode="live">Live</button>
        <button class="mode-btn" data-mode="playback">Playback</button>
      </div>
    </div>

    <div class="embed-shell">
      <div class="embed-frame-wrap">
        <!--
          When stream data is provided, set data-live-src and data-playback-src below.
          The embed will auto-load without any user input.
        -->
        <iframe id="iframeA"
          data-live-src="https://player.onestream.live/embed?token=6343dc95c202d56b469cf9456d4b8dcfd4b11ec95a7f186457cd8ceed75ab09e&type=sp"
          data-playback-src="https://player.onestream.live/embed?token=785e978c18840e90602adb9d00177c34c2e7c7f4c86a6684a539b025732357bc&type=sp"
          style="display:none"
          allowfullscreen
          allow="autoplay; fullscreen; picture-in-picture"
          frameborder="0"></iframe>
        <div class="embed-placeholder" id="placeholderA">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <p>OneStream — pending configuration</p>
          <small>Stream data will be added shortly</small>
        </div>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="dotA"></div>
        <span class="status-label" id="labelA">Awaiting configuration</span>
      </div>
    </div>

  </div><!-- /routeA -->

  <!-- ══════════════════════════════════════
       ROUTE B — Restream
  ══════════════════════════════════════ -->
  <div class="tab-panel" id="routeB" role="tabpanel">

    <div class="config-card">
      <div class="label-row">
        <label class="input-label">Restream Embed</label>
      </div>
      <div class="mode-toggle" id="modeToggleB">
        <button class="mode-btn active" data-mode="live">Live</button>
        <button class="mode-btn" data-mode="playback">Playback</button>
      </div>
    </div>

    <div class="embed-shell">
      <div class="embed-frame-wrap">
        <iframe id="iframeB"
          data-live-src="https://player.restream.io/?token=a133c42a44054eb999e89bed3b44163c&vwrs=1&offlineText=OFFLINE"
          data-playback-src="https://player.restream.io/?token=55db01fe62224af7bfeaeabea23b544c&vwrs=1&offlineText=OFFLINE"
          style="display:none"
          allowfullscreen
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          frameborder="0"></iframe>
        <div class="embed-placeholder" id="placeholderB">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <p>Restream — pending configuration</p>
          <small>Stream data will be added shortly</small>
        </div>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="dotB"></div>
        <span class="status-label" id="labelB">Awaiting configuration</span>
      </div>
    </div>

  </div><!-- /routeB -->

  <!-- ══════════════════════════════════════
       ROUTE C — Own Player (video.js + VR180)
  ══════════════════════════════════════ -->
  <div class="tab-panel" id="routeC" role="tabpanel">

    <!-- Sub-tabs: Flat / VR180 -->
    <div class="sub-tab-bar">
      <button class="sub-tab-btn" data-mode="flat" id="subTabFlat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Flat
      </button>
      <button class="sub-tab-btn active" data-mode="180" id="subTab180">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
        VR180
      </button>
    </div>

    <div class="config-card" style="padding:10px 16px">
      <div class="error-box" id="errorBoxC"></div>
    </div>

    <div class="player-shell">
      <div class="player-wrap" id="playerWrapC">

        <video id="hlsPlayerC"
          class="video-js vjs-default-skin vjs-big-play-centered"
          controls preload="none" playsinline
          data-setup='{}'>
        </video>

        <canvas id="threeCanvas"></canvas>

        <div class="drag-hint" id="dragHintC">Drag to look around · Scroll to zoom</div>

      </div>
      <div class="status-bar">
        <div class="status-dot" id="dotC"></div>
        <span class="status-label" id="labelC">No stream loaded</span>
        <div class="status-meta" id="metaC"></div>
      </div>
    </div>

  </div><!-- /routeC -->

</div><!-- /layout -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/7.21.5/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════
     TAB SWITCHING
  ═══════════════════════════════════════════════════ */
  const tabBtns   = document.querySelectorAll('.tab-btn');
  const tabPanels = document.querySelectorAll('.tab-panel');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      tabBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      tabPanels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById(target).classList.add('active');
    });
  });

/* Route A — static pre-configured embed (auto-loads when src is set) */
  (function () {
    const iframe      = document.getElementById('iframeA');
    const placeholder = document.getElementById('placeholderA');
    const dot         = document.getElementById('dotA');
    const label       = document.getElementById('labelA');
    const modeBtns    = document.getElementById('modeToggleA').querySelectorAll('.mode-btn');
    let mode = 'live';

    function src() {
      return mode === 'live' ? iframe.dataset.liveSrc : iframe.dataset.playbackSrc;
    }
    function setStatus(state, text) {
      dot.className     = 'status-dot' + (state ? ' s-' + state : '');
      label.textContent = text;
    }
    function load() {
      const s = src();
      if (!s) {
        iframe.style.display      = 'none';
        placeholder.style.display = '';
        setStatus(null, 'Awaiting configuration');
        return;
      }
      placeholder.style.display = 'none';
      iframe.style.display      = 'block';
      iframe.src = s;
      setStatus('loading', 'Loading…');
    }

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        load();
      });
    });

    iframe.addEventListener('load', () => {
      if (iframe.src && iframe.src !== 'about:blank') {
        setStatus(mode === 'live' ? 'live' : null,
                  mode === 'live' ? 'Live stream' : 'Playback');
      }
    });

    load(); // auto-load if src is already set
  }());

  /* Route B — Restream embed */
  (function () {
    const iframe      = document.getElementById('iframeB');
    const placeholder = document.getElementById('placeholderB');
    const dot         = document.getElementById('dotB');
    const label       = document.getElementById('labelB');
    const modeBtns    = document.getElementById('modeToggleB').querySelectorAll('.mode-btn');
    let mode = 'live';

    function src() {
      return mode === 'live' ? iframe.dataset.liveSrc : iframe.dataset.playbackSrc;
    }
    function setStatus(state, text) {
      dot.className     = 'status-dot' + (state ? ' s-' + state : '');
      label.textContent = text;
    }
    function load() {
      const s = src();
      if (!s) {
        iframe.style.display      = 'none';
        placeholder.style.display = '';
        setStatus(null, 'Awaiting configuration');
        return;
      }
      placeholder.style.display = 'none';
      iframe.style.display      = 'block';
      iframe.src = s;
      setStatus('loading', 'Loading…');
    }
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        load();
      });
    });
    iframe.addEventListener('load', () => {
      if (iframe.src && iframe.src !== 'about:blank') {
        setStatus(mode === 'live' ? 'live' : null,
                  mode === 'live' ? 'Live stream' : 'Playback');
      }
    });
    load();
  }());

  /* ═══════════════════════════════════════════════════
     ROUTE C — video.js + Three.js (VR180 default)
  ═══════════════════════════════════════════════════ */
  const DACAST_URL      = 'https://playlist.dacast.com/live/1b5afed9-612b-eb62-4c87-e68f598d3fe6-live-f1c825c6-4194-4210-8844-34579cfca788/master.m3u8';
  const DACAST_VR180    = 'https://view.dacast.com/1b5afed9-612b-eb62-4c87-e68f598d3fe6-live-aea837ee-d1d6-4031-b2cf-265ca3e8e17a/adaptive.m3u8';
  const errorBoxC   = document.getElementById('errorBoxC');
  const dotC        = document.getElementById('dotC');
  const labelC      = document.getElementById('labelC');
  const metaC       = document.getElementById('metaC');
  const threeCanvas = document.getElementById('threeCanvas');
  const dragHintC   = document.getElementById('dragHintC');
  const subTabBtns  = document.querySelectorAll('.sub-tab-btn');

  const player = videojs('hlsPlayerC', {
    fluid: true,
    responsive: true,
    html5: {
      vhs: { overrideNative: true, enableLowInitialPlaylist: true },
      nativeVideoTracks: false,
      nativeAudioTracks: false,
      nativeTextTracks: false,
    },
    controlBar: {
      children: [
        'playToggle','volumePanel',
        'currentTimeDisplay','timeDivider','durationDisplay',
        'progressControl','liveDisplay','seekToLive',
        'remainingTimeDisplay','customControlSpacer',
        'playbackRateMenuButton',
        'subtitlesButton','captionsButton','audioTrackButton',
        'fullscreenToggle',
      ],
    },
  });

  /* Three.js globals */
  let renderer, scene, camera, sphereMesh, videoTexture;
  let viewMode    = '180';
  let animFrameId = null;
  let lon = 0, lat = 0, targetLon = 0, targetLat = 0;
  let isDragging = false, prevX = 0, prevY = 0, dragMoved = false;
  let hintTimer = null;

  function initThree() {
    if (renderer) return;
    renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    scene  = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, 16 / 9, 0.1, 1000);
    const videoEl = player.el().querySelector('video');
    videoTexture = new THREE.VideoTexture(videoEl);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    syncRendererSize();
  }

  function buildSphere(mode) {
    if (sphereMesh) { scene.remove(sphereMesh); sphereMesh.geometry.dispose(); sphereMesh = null; }
    let geo;
    if (mode === '360') {
      geo = new THREE.SphereGeometry(500, 64, 32);
      geo.scale(-1, 1, 1);
    } else {
      // VR180: front hemisphere only
      geo = new THREE.SphereGeometry(500, 64, 32, -Math.PI / 2, Math.PI, 0, Math.PI);
      geo.scale(-1, 1, 1);
    }
    sphereMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: videoTexture }));
    scene.add(sphereMesh);
  }

  function syncRendererSize() {
    if (!renderer) return;
    const w = threeCanvas.clientWidth  || threeCanvas.parentElement.clientWidth;
    const h = threeCanvas.clientHeight || threeCanvas.parentElement.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  window.addEventListener('resize', syncRendererSize);

  function startRender() {
    if (animFrameId) return;
    (function loop() {
      animFrameId = requestAnimationFrame(loop);
      syncRendererSize();
      lon += (targetLon - lon) * 0.08;
      lat += (targetLat - lat) * 0.08;
      const phi   = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      camera.lookAt(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      const vid = player.el().querySelector('video');
      if (vid && vid.readyState >= 2) videoTexture.needsUpdate = true;
      renderer.render(scene, camera);
    }());
  }

  function stopRender() {
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  }

  function setMode(mode) {
    viewMode = mode;
    subTabBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    if (mode === 'flat') {
      threeCanvas.style.display = 'none';
      stopRender();
      dragHintC.classList.remove('show');
    } else {
      initThree();
      buildSphere(mode);
      lon = targetLon = 0;
      lat = targetLat = 0;
      camera.fov = 75;
      camera.updateProjectionMatrix();
      threeCanvas.style.display = 'block';
      startRender();
      dragHintC.classList.add('show');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => dragHintC.classList.remove('show'), 3000);
    }
  }

  /* Sub-tab clicks switch mode */
  subTabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setMode(btn.dataset.mode);
      loadStreamC(DACAST_URL);
    });
  });

  /* ── Mouse controls ───────────────────── */
  threeCanvas.addEventListener('mousedown', e => {
    isDragging = true; dragMoved = false;
    prevX = e.clientX; prevY = e.clientY;
    threeCanvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    targetLon -= dx * 0.25; targetLat += dy * 0.25;
    targetLat = Math.max(-85, Math.min(85, targetLat));
    if (viewMode === '180') targetLon = Math.max(-85, Math.min(85, targetLon));
    prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('mouseup', () => {
    if (!dragMoved && isDragging) player.paused() ? player.play() : player.pause();
    isDragging = false; threeCanvas.classList.remove('dragging');
  });

  /* ── Touch controls ───────────────────── */
  let lastTouch = null, pinchDist0 = 0, fov0 = 75;
  threeCanvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      isDragging = true; dragMoved = false;
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      isDragging = false;
      pinchDist0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      fov0 = camera ? camera.fov : 75;
    }
  }, { passive: false });
  threeCanvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!camera) return;
    if (e.touches.length === 1 && isDragging && lastTouch) {
      const dx = e.touches[0].clientX - lastTouch.x, dy = e.touches[0].clientY - lastTouch.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
      targetLon -= dx * 0.3; targetLat += dy * 0.3;
      targetLat = Math.max(-85, Math.min(85, targetLat));
      if (viewMode === '180') targetLon = Math.max(-85, Math.min(85, targetLon));
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      camera.fov = Math.max(30, Math.min(110, fov0 * (pinchDist0 / dist)));
      camera.updateProjectionMatrix();
    }
  }, { passive: false });
  threeCanvas.addEventListener('touchend', () => {
    if (!dragMoved && isDragging) player.paused() ? player.play() : player.pause();
    isDragging = false; lastTouch = null;
  });
  threeCanvas.addEventListener('wheel', e => {
    if (!camera) return;
    e.preventDefault();
    camera.fov = Math.max(30, Math.min(110, camera.fov + e.deltaY * 0.05));
    camera.updateProjectionMatrix();
  }, { passive: false });

  /* ── Status helpers ───────────────────── */
  function setStatusC(state, text) {
    dotC.className    = 'status-dot' + (state ? ' s-' + state : '');
    labelC.textContent = text;
  }
  function showError(msg) {
    errorBoxC.innerHTML = msg + ' <button class="retry-btn" id="retryBtn">Retry</button>';
    errorBoxC.style.display = 'block';
    document.getElementById('retryBtn').addEventListener('click', () => loadStreamC(player.src() || DACAST_URL));
  }
  function clearError() { errorBoxC.style.display = 'none'; errorBoxC.innerHTML = ''; }
  function fmtTime(s) {
    if (!isFinite(s) || s < 0) return '--:--';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = Math.floor(s % 60);
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
  }
  function isLive() { const d = player.duration(); return !isFinite(d) || d === Infinity; }

  setInterval(() => {
    if (!player.src()) return;
    try {
      const vhs = player.tech({ IWillNotUseThisInPlugins: true })?.vhs;
      const pl  = vhs?.playlists?.media?.();
      if (!pl) return;
      const a = pl.attributes || {};
      const parts = [];
      if (a.BANDWIDTH)   parts.push(`${Math.round(a.BANDWIDTH / 1000)} kbps`);
      if (a.RESOLUTION)  parts.push(`${a.RESOLUTION.width}×${a.RESOLUTION.height}`);
      metaC.innerHTML = parts.map(p => `<span>${p}</span>`).join('');
    } catch (_) {}
  }, 2000);

  /* ── Player events ────────────────────── */
  player.on('loadstart', () => { setStatusC('loading', 'Loading…'); metaC.innerHTML = ''; });
  player.on('waiting',   () => setStatusC('loading', 'Buffering…'));
  player.on('playing',   () => {
    clearError();
    setStatusC(isLive() ? 'live' : null, isLive() ? 'Live stream' : `Playing · ${fmtTime(player.duration())}`);
  });
  player.on('pause', () => setStatusC(null, isLive() ? 'Paused — live' : 'Paused'));
  player.on('ended', () => setStatusC(null, 'Stream ended'));
  player.on('error', () => {
    const err = player.error();
    const msg = { 1:'Aborted', 2:'Network error', 3:'Decode error', 4:'Format not supported' }[err?.code] || 'Playback failed';
    setStatusC('error', 'Error');
    showError(`${msg}. Check the URL and CORS headers on the server.`);
  });


  function loadStreamC(url) {
    url = url || DACAST_URL;
    clearError();
    setStatusC('loading', 'Connecting…');
    player.src({ src: url, type: 'application/x-mpegURL' });
    player.play().catch(() => {});
  }

  /* ── Keyboard shortcuts (Route C only) ── */
  document.addEventListener('keydown', e => {
    if (!document.getElementById('routeC').classList.contains('active')) return;
    if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    switch (e.key) {
      case ' ':           e.preventDefault(); player.paused() ? player.play() : player.pause(); break;
      case 'm': case 'M': player.muted(!player.muted()); break;
      case 'f': case 'F': player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen(); break;
      case '1': setMode('flat'); break;
      case '2': setMode('180');  break;
      case 'ArrowLeft':  e.preventDefault(); if (!isLive()) player.currentTime(Math.max(0, player.currentTime() - 10)); break;
      case 'ArrowRight': e.preventDefault(); if (!isLive()) player.currentTime(player.currentTime() + 10); break;
      case 'ArrowUp':    e.preventDefault(); player.volume(Math.min(1, player.volume() + 0.1)); break;
      case 'ArrowDown':  e.preventDefault(); player.volume(Math.max(0, player.volume() - 0.1)); break;
    }
  });

  document.querySelectorAll('.c-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.c-chip').forEach(c => c.classList.remove('active-chip'));
      chip.classList.add('active-chip');
      loadStreamC(chip.dataset.src);
    });
  });

  /* Initialise Route C in VR180 mode and auto-load the flat stream */
  setMode('180');
  loadStreamC(DACAST_URL);

}());
</script>
</body>
</html>
